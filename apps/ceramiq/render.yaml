services:
  - type: web
    name: ceramiq
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: CERAMIQ_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: CERAMIQ_AGENT_MODEL
        value: gpt-4.1-mini
      - key: CERAMIQ_ENABLE_OPENAI_AGENT
        value: "1"
      - key: CERAMIQ_ENABLE_WEB_SEARCH
        value: "1"
